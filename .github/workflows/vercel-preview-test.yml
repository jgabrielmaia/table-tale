name: Vercel preview test (temporary)

on:
  push:
    branches: [ci/vercel-deploy-env-only]
    paths: [.github/workflows/vercel-preview-test.yml]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --global vercel@65.11.0
      - name: Preview deploy (no --prod), env-only linking
        run: vercel deploy --yes
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
