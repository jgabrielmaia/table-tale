# Configuração do Supabase CLI (desenvolvimento local: `npx supabase start`).
# Em produção estes valores configuram-se no painel do projeto Supabase.
project_id = "table-tale"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:5173/table-tale"
additional_redirect_urls = [
  "http://localhost:5173/table-tale/auth/callback",
  "https://jgabrielmaia.com/table-tale/auth/callback",
]
jwt_expiry = 3600
enable_signup = true
# Permite associar Google e magic link à mesma conta (linkIdentity).
enable_manual_linking = true

[auth.email]
enable_signup = true
enable_confirmations = false
# Sem passwords: apenas magic link / OTP.
otp_expiry = 3600

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

[auth.external.github]
enabled = true
client_id = "env(GITHUB_CLIENT_ID)"
secret = "env(GITHUB_CLIENT_SECRET)"


[storage]
enabled = true
file_size_limit = "2MiB"

# Edge Function do BoardGameGeek (o token BGG_API_TOKEN é um segredo da função: `supabase secrets set`).
[functions.bgg]
enabled = true
verify_jwt = true
